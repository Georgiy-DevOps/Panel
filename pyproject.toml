[tool.black]
target-version = ['py312']
extend-exclude = '(test/fixtures/|node_modules/|\.ci-tools/)'

[tool.ruff]
target-version = 'py312'
extend-exclude = ['test/fixtures', 'node_modules', '.ci-tools']

[tool.ruff.lint]
select = ['E4', 'E7', 'E9', 'F']

[tool.coverage.run]
branch = true
source = ['ops/backup', 'ops/ssh-alerts', 'ops/deploy']
omit = ['*/test_*.py']

[tool.coverage.report]
show_missing = true

[tool.coverage.xml]
output = 'coverage/python.xml'
